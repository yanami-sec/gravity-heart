<dialog id="memory-dialog" class="memory-dialog" aria-labelledby="memory-title"><div class="editor-top"><span class="kicker" id="memory-number">想珍藏的心动</span><button id="close-memory" class="close" aria-label="收起这颗星星">×</button></div><h2 id="memory-title"></h2><img id="memory-photo" class="memory-photo" alt="这一段心动里的照片" hidden><p id="memory-body"></p><button id="next-memory" class="paper-button">下一颗星星 ↗</button></dialog>
<dialog id="reply-dialog" class="reply-dialog" aria-labelledby="reply-title"><form id="reply-form"><div class="editor-top"><h2 id="reply-title">这一次，换我写给你。</h2><button id="close-reply" class="close" type="button" aria-label="关闭回信">×</button></div><p class="reply-help">想说什么都可以，按自己的心意写。保存成图片或复制文字，再亲手发给对方。</p><label for="reply-name">你的落款</label><input id="reply-name" maxlength="20" autocomplete="off"><label for="reply-message">我想对你说</label><textarea id="reply-message" maxlength="600" placeholder="读完这封信，我想说……"></textarea><p id="reply-error" class="reply-error" role="alert"></p><div class="reply-actions"><button id="copy-reply" type="button">复制回信文字</button><button id="save-reply" class="primary" type="submit">保存回信图片 ↓</button></div><img id="reply-preview" class="reply-preview" alt="生成的回信图片，可以长按保存" hidden><p id="reply-result" class="reply-help" aria-live="polite"></p></form></dialog>
