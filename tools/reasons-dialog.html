<dialog id="reason-dialog" class="reason-dialog" aria-labelledby="reason-dialog-title">
 <button type="button" id="close-reasons" class="dialog-close" aria-label="关闭优点清单">×</button>
 <p id="reason-dialog-title" class="eyebrow">你身上的每一份闪光</p>
 <div id="reason-detail" class="reason-detail">
  <div class="reason-folio"><b aria-hidden="true">✧</b><span id="reason-index" hidden>001</span><span><span id="reason-total">100</span> 个优点</span></div>
  <p id="reason-group" class="reason-group">温柔有光</p>
  <h2 id="reason-quote" class="reason-quote"></h2>
  <p id="reason-dedication" class="reason-dedication"></p>
  <div class="reason-navigation"><button id="previous-reason" type="button" aria-label="上一个优点">← 上一个</button><button id="next-reason" type="button" aria-label="下一个优点">下一个 →</button></div>
 </div>
 <details id="reason-catalog" class="reason-catalog"><summary><span id="reason-all-count">全部 100 个优点</span><small>每一种美好，都在你身上闪光</small></summary><div id="reason-list" class="reason-list"></div></details>
</dialog>
